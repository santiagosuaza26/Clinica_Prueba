# Production Configuration

# Database Configuration for Production - Override H2 defaults
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:clinic_db}
spring.datasource.username=${POSTGRES_USER:clinic_user}
spring.datasource.password=${POSTGRES_PASSWORD:clinic_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 in production
spring.h2.console.enabled=false

# Logging for Production
logging.level.app.clinic=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.data.mongodb=WARN

# MongoDB Production Configuration (only if credentials are provided)
spring.data.mongodb.enabled=${MONGO_ENABLED:true}
spring.data.mongodb.host=${MONGO_HOST:mongo}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=${MONGO_DATABASE:clinic_medical_history}
spring.data.mongodb.username=${MONGO_USERNAME:clinic_user}
spring.data.mongodb.password=${MONGO_PASSWORD:clinic_pass}
spring.data.mongodb.authentication-database=admin
spring.data.mongodb.auto-index-creation=true

# Security for Production
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Actuator for Production
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Swagger/OpenAPI Configuration for Production
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.config-url=/api-docs/swagger-config
springdoc.swagger-ui.url=/api-docs

# Connection pool configuration for production
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000